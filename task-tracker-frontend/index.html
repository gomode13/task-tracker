<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Планировщик задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body class="app-bg">

<nav class="navbar navbar-expand app-navbar sticky-top border-bottom">
    <div class="container">
        <span class="navbar-brand mb-0 h1" id="appTitle">Планировщик задач</span>

        <div class="d-none d-flex align-items-center gap-2" id="guestArea">
            <button type="button" class="btn btn-outline-secondary" id="openRegisterButton" data-bs-toggle="modal"
                    data-bs-target="#registerModal">Регистрация
            </button>
            <button type="button" class="btn btn-primary" id="openLoginButton" data-bs-toggle="modal"
                    data-bs-target="#loginModal">Вход
            </button>
        </div>

        <div class="d-none d-flex align-items-center gap-3" id="userArea">
            <span class="text-body-secondary" id="userEmailLabel"></span>
            <button type="button" class="btn btn-outline-secondary" id="logoutButton">Выйти</button>
        </div>
    </div>
</nav>

<main class="container d-none py-4" id="mainContent">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="alert alert-danger d-none" role="alert" id="taskError"></div>

            <div class="input-group input-group-lg mb-4">
                <input type="text" class="form-control" id="newTaskTitleInput" placeholder="Что нужно сделать?"
                       aria-label="Заголовок новой задачи">
                <button class="btn btn-primary" type="button" id="addTaskButton">Добавить</button>
            </div>

            <h2 class="h5 section-heading" id="activeTasksHeading">Не сделано</h2>
            <ul class="list-group task-list mb-5" id="activeTasksList">
                <!--
                <li class="list-group-item d-flex align-items-center gap-3" data-task-id="1">
                  <input class="form-check-input mt-0" type="checkbox">
                  <button type="button" class="btn btn-link p-0 text-decoration-none text-body flex-grow-1 text-start task-title" data-bs-toggle="modal" data-bs-target="#taskModal">Заголовок задачи</button>
                </li>
                -->
            </ul>

            <h2 class="h5 section-heading" id="doneTasksHeading">Сделано</h2>
            <ul class="list-group task-list" id="doneTasksList">
                <!--
                <li class="list-group-item d-flex align-items-center gap-3" data-task-id="2">
                  <input class="form-check-input mt-0" type="checkbox" checked>
                  <button type="button" class="btn btn-link p-0 text-decoration-none text-body-secondary flex-grow-1 text-start task-title" data-bs-toggle="modal" data-bs-target="#taskModal">Сделанная задача</button>
                </li>
                -->
            </ul>

        </div>
    </div>
</main>

<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="registerForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Регистрация</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" role="alert" id="registerError"></div>
                    <div class="mb-3">
                        <label class="form-label" for="registerEmailInput">Email</label>
                        <input type="email" class="form-control" id="registerEmailInput" autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="registerPasswordInput">Пароль</label>
                        <input type="password" class="form-control" id="registerPasswordInput"
                               autocomplete="new-password">
                    </div>
                    <div>
                        <label class="form-label" for="registerPasswordRepeatInput">Повтор пароля</label>
                        <input type="password" class="form-control" id="registerPasswordRepeatInput"
                               autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" id="registerSubmitButton">Зарегистрироваться</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="loginForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Вход</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" role="alert" id="loginError"></div>
                    <div class="mb-3">
                        <label class="form-label" for="loginEmailInput">Email</label>
                        <input type="email" class="form-control" id="loginEmailInput" autocomplete="email">
                    </div>
                    <div>
                        <label class="form-label" for="loginPasswordInput">Пароль</label>
                        <input type="password" class="form-control" id="loginPasswordInput"
                               autocomplete="current-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" id="loginSubmitButton">Войти</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalLabel">Задача</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="taskIdInput">
                <div class="mb-3">
                    <label class="form-label" for="taskTitleInput">Заголовок</label>
                    <input type="text" class="form-control" id="taskTitleInput">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="taskDescriptionInput">Описание</label>
                    <textarea class="form-control" id="taskDescriptionInput" rows="5"></textarea>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="taskDoneCheckbox">
                    <label class="form-check-label" for="taskDoneCheckbox">Сделана</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-danger" id="deleteTaskButton">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="js/app.js"></script>
</body>
</html>
